<!DOCTYPE html>
<html>
<head>
    <title>Test Modal</title>
    <style>
        body { background: black; color: white; font-family: Arial; padding: 20px; text-align: center; }
        .carte { 
            width: 200px; 
            cursor: pointer; 
            border: 2px solid gold; 
            border-radius: 10px; 
            padding: 10px;
            margin: 20px auto;
        }
        .carte img { width: 100%; border-radius: 10px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-contenu { max-width: 500px; background: black; border: 2px solid gold; padding: 20px; border-radius: 20px; }
        .modal-contenu img { width: 100%; }
        .modal-fermer { margin-top: 20px; padding: 10px 20px; cursor: pointer; background: gold; border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>TEST MODAL</h1>

    <div class="carte" onclick="ouvrirModal()">
        <img src="/images/common/aqua/common-siren.webp" alt="Siren Teddy">
        <h3>SIREN TEDDY</h3>
    </div>

    <div class="modal" id="modal">
        <div class="modal-contenu">
            <img id="modalImage" src="" alt="">
            <br>
            <button class="modal-fermer" onclick="fermerModal()">Fermer</button>
        </div>
    </div>

    <script>
        function ouvrirModal() {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = "/images/common/aqua/common-siren.webp";
            modal.classList.add('active');
            console.log("Modal ouvert !");
        }

        function fermerModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>

</body>
</html>
