<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps - Mutant Teddy Bear</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: black;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/images/design/font-site/page de font%20(2).webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.7;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            color: #ffd700;
            margin: 20px 0 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .grille {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            justify-items: center;
            margin-top: 20px;
        }

        .carte {
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .carte:hover {
            transform: translateY(-10px);
            border-color: #ffd700;
        }

        .carte img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 15px;
            background: #111;
        }

        .carte p {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Modal pour agrandissement */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-contenu {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            text-align: center;
        }

        .modal-contenu img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .modal-fermer {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .modal-fermer:hover {
            background: #ffd700;
            color: black;
        }

        .boutons-nav {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0 20px;
        }

        .bouton {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .bouton:hover {
            background: #ffd700;
            color: black;
        }

        #boutonMusique {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid #ffd700;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
        }

        @media (max-width: 700px) {
            .grille { gap: 15px; }
            .carte { max-width: 260px; }
            h1 { font-size: 36px; }
        }
    </style>
</head>
<body>

    <audio id="musiqueFond" src="/presentation/musique/mutant-teddy-bear-01-mp3.mp3" preload="auto" loop></audio>

    <div class="container">
        <h1>THE WORLD TEDDY BEAR</h1>
        <div class="boutons-nav">
            <a href="/index.html" class="bouton">← Accueil</a>
            <a href="/menu.html" class="bouton">← Menu</a>
        </div>

        <div class="grille" id="grille"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-contenu">
            <img id="modalImage" src="" alt="Aperçu">
            <button class="modal-fermer" onclick="fermerModal()">Fermer</button>
        </div>
    </div>

    <button id="boutonMusique">🔇 Activer la musique</button>

    <script>
        // === LISTE DES IMAGES (petite vignette 500x500, grande 3000x3000) ===
        // Remplace les noms par ceux de tes fichiers dans /images/common/maps/
        const imagesData = [
            { thumb: "/images/common/maps/maps-01.png", full: "/images/common/maps/maps-01.png", titre: "MAPS WORLD" },
            { thumb: "/images/common/maps/maps-02.png", full: "/images/common/maps/maps-02.png", titre: "MAPS WORLD 2 " },
            { thumb: "/images/common/maps/maps-3.webp", full: "/images/common/maps/maps-3.webp", titre: "MAPS LANDS" },
            { thumb: "/images/common/maps/carte4_500.jpg", full: "/images/common/maps/carte4_3000.jpg", titre: "" }
            // Ajoute autant d'objets que nécessaire
        ];

        const grille = document.getElementById('grille');

        imagesData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'carte';
            card.onclick = () => ouvrirModal(index);
            card.innerHTML = `
                <img src="${item.thumb}" alt="${item.titre}" loading="lazy">
                <p>${item.titre}</p>
            `;
            grille.appendChild(card);
        });

        // Modal avec image haute résolution
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');

        function ouvrirModal(index) {
            modalImage.src = imagesData[index].full;
            modal.classList.add('active');
        }

        function fermerModal() {
            modal.classList.remove('active');
        }

        // Gestion musique (comme les autres pages)
        const musiqueFond = document.getElementById('musiqueFond');
        const boutonMusique = document.getElementById('boutonMusique');

        if (localStorage.getItem('musiqueJoue') === 'true') {
            musiqueFond.play().catch(e => console.log("Auto-play bloqué"));
            boutonMusique.textContent = '🔊 Couper la musique';
        } else {
            boutonMusique.textContent = '🔇 Activer la musique';
        }

        boutonMusique.addEventListener('click', () => {
            if (musiqueFond.paused) {
                musiqueFond.play();
                boutonMusique.textContent = '🔊 Couper la musique';
                localStorage.setItem('musiqueJoue', 'true');
            } else {
                musiqueFond.pause();
                boutonMusique.textContent = '🔇 Activer la musique';
                localStorage.setItem('musiqueJoue', 'false');
            }
        });

        // Fermeture modale par clic extérieur ou touche Echap
        window.addEventListener('click', (e) => {
            if (e.target === modal) fermerModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fermerModal();
        });
    </script>
</body>
</html>
