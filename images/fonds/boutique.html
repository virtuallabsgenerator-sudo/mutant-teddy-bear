<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Boutique</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('../common/boutique/teddy-dragon.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: rgba(0,0,0,0.7);
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    width: 250px;
    text-align: center;
}

.card img {
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
}

button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    background: #ff3c3c;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

button:disabled {
    background: grey;
}

.nav {
    margin-top: 20px;
}

/* 🔥 GALERIE */
#gallery {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:1000;
}

#gallery img {
    max-width:90%;
    max-height:80%;
}

.gallery-controls button {
    margin:10px;
}
</style>
</head>

<body>

<header>
    <h1>🛒 Boutique</h1>
    <div class="nav">
        <button onclick="location.href='../fonds/teddy-presentation.html'">Présentation</button>
        <button onclick="location.href='../../menu.html'">Menu</button>
    </div>
</header>

<audio controls autoplay loop>
    <source src="../../presentation/musique/mutant-teddy-bear-interlude-8.mp3" type="audio/mpeg">
</audio>

<div class="container" id="shop"></div>

<!-- GALERIE -->
<div id="gallery">
    <img id="gallery-img">
    <div class="gallery-controls">
        <button onclick="prevImage()">⬅</button>
        <button onclick="nextImage()">➡</button>
        <button onclick="closeGallery()">❌</button>
    </div>
</div>

<script>

// 🛍️ PRODUITS COMPLETS
let products = [

    { name:"Teddy Toy Dragon", price:29.99,

    { name:"Teddy Toy Reptil", price:29.99,

      stock:5, desc:"Reptil édition limitée" },

    { name:"Teddy Toy Rock", price:29.99,
      images:["../common/boutique/teddy-rock.jpg"],
      stock:5, desc:"Rock édition limitée" },

    { name:"Teddy Toy Sauvage", price:29.99,
      images:["../common/boutique/teddy-sauvage.jpeg"],
      stock:5, desc:"Sauvage édition limitée" },

    { name:"Teddy Toy Vampire", price:29.99,
      images:["../common/boutique/teddy-vampire-2.jpg"],
      stock:5, desc:"Vampire édition limitée" },

    { name:"Teddy Toy Black", price:29.99,
      images:["../common/boutique/teddy-black.jpg"],
      stock:300, desc:"Black édition limitée" },

    { name:"M.T.B Luxe Polo", price:29.99,
      images:["../common/boutique/polo.jpg",
    "../common/boutique/_10e4bb34-458f-44af-9f42-36b915525dd0.jpg ",
    "../common/boutique/polo-noir-edition-1.jpg "
  ],
      stock:25,
      sizes:["XS","S","M","L","XL","XXL"],
      desc:"Polo noir slim fit 100% coton" },

    { name:"M.T.B Sportswear", price:99.99,
      images:["../common/boutique/sport-swear.jpg",
    "../common/boutique/sportswear-dos-2.jpg "
  ],
      stock:25,
      sizes:["XS","S","M","L","XL","XXL"],
      desc:"Survêtement noir streetwear" },

    { name:"M.T.B Sportswear", price:99.99,
      images:["../common/boutique/sportswear-turquoise-1.jpg",
    "../images/common/boutique/sportswear-turcoise.jpg "
  ],
      stock:25,
      sizes:["XS","S","M","L","XL","XXL"],
      desc:"Survêtement streetwear turquoise color" },

    { name:"M.T.B Tee-shirt", price:24.99,
      images:["../common/boutique/tee-shurt-teddy.jpg"],
      stock:25,
      sizes:["XS","S","M","L","XL","XXL"],
      desc:"T-shirt street urban" },

    { name:"M.T.B Tee-shirt 2", price:24.99,
      images:["../common/boutique/tee-shurt-2.jpg"],
      stock:25,
      sizes:["XS","S","M","L","XL","XXL"],
      desc:"T-shirt urban style" },

    { name:"M.T.B Cap Trucker", price:39.99,
      images:["../common/boutique/casquette-trucker-camouflage-poulpe.jpg"],
      stock:25, desc:"Cap trucker camouflage color" },

     { name:"M.T.B Cap classic", price:39.99,
      images:["../common/boutique/casquette-noir-poulpe.jpg"],
      stock:25, desc:"Cap classic black color" },

    { name:"M.T.B Cap sportswear", price:39.99,
      images:["../common/boutique/casquette-sportswear-turcoise.jpg"],
      stock:25, desc:"Cap sportswear turquoise color" },
    
    { name:"M.T.B Soccer ball", price:39.99,
      images:["../common/boutique/ball-foot.jpg"],
      stock:25, desc:"Ballon football" },

    { name:"M.T.B Basketball", price:39.99,
      images:["../common/boutique/ball-basket.jpg"],
      stock:25, desc:"Ballon basket" },

    { name:"M.T.B Mug 1", price:8.99,
      images:["../common/boutique/mug-3.jpg"],
      stock:25, desc:"Mug blanc" },

    { name:"M.T.B Mug 2", price:8.99,
      images:["../common/boutique/mug.jpg"],
      stock:25, desc:"Mug rouge" },

    { name:"M.T.B Key ring", price:3.99,
      images:["../common/boutique/porte-cle-2.jpg"],
      stock:25, desc:"Porte-clé" }

];

// 🧠 AFFICHAGE
function renderShop() {
    let shop = document.getElementById("shop");
    shop.innerHTML = "";

    products.forEach((p, index) => {

        let stockText = p.stock > 0 ? `Stock: ${p.stock}` : "❌ Rupture";
        let disabled = p.stock === 0 ? "disabled" : "";

        shop.innerHTML += `
        <div class="card">
            <img src="${p.images[0]}" onclick="openGallery(${index},0)">
            <h3>${p.name}</h3>
            <p>${p.desc}</p>
            <p>💰 ${p.price}€</p>
            <p>${stockText}</p>

            ${p.sizes ? `
            <select id="size-${index}">
                ${p.sizes.map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>` : ""}

            <input type="number" id="qty-${index}" min="1" max="${p.stock}" value="1">

            <button ${disabled} onclick="buy(${index})">Acheter</button>
        </div>
        `;
    });
}

// 💳 ACHAT
function buy(index) {
    let product = products[index];
    let qty = parseInt(document.getElementById(`qty-${index}`).value);
    let size = product.sizes ? document.getElementById(`size-${index}`).value : null;

    if (qty > product.stock) {
        alert("Stock insuffisant !");
        return;
    }

    product.stock -= qty;

    alert(`Achat : ${qty} x ${product.name} ${size ? "- Taille: " + size : ""}`);
    renderShop();
}

// 🔥 GALERIE
let currentProduct = 0;
let currentImage = 0;

function openGallery(index, imgIndex) {
    currentProduct = index;
    currentImage = imgIndex;
    document.getElementById("gallery").style.display = "flex";
    updateGallery();
}

function updateGallery() {
    let product = products[currentProduct];
    document.getElementById("gallery-img").src = product.images[currentImage];
}

function nextImage() {
    let product = products[currentProduct];
    currentImage = (currentImage + 1) % product.images.length;
    updateGallery();
}

function prevImage() {
    let product = products[currentProduct];
    currentImage = (currentImage - 1 + product.images.length) % product.images.length;
    updateGallery();
}

function closeGallery() {
    document.getElementById("gallery").style.display = "none";
}

// 🚀 INIT
renderShop();

</script>

</body>
</html>
