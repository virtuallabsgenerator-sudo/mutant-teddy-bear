function renderShop() {
    let shop = document.getElementById("shop");
    shop.innerHTML = "";

    products.forEach((p, index) => {

        let stockText = p.stock > 0 ? `Stock: ${p.stock}` : "❌ Rupture";

        let disabled = p.stock === 0 ? "disabled" : "";

        shop.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <h3>${p.name}</h3>
            <p>${p.desc}</p>
            <p>${p.price}€</p>
            <p>${stockText}</p>

          ${p.sizes ? `
        <select id="size-${index}">
        ${p.sizes.map(size => `<option value="${size}">${size}</option>`).join('')}
        </select>
        ` : ''}

<input type="number" id="qty-${index}" min="1" max="${p.stock}" value="1">

            <button ${disabled} onclick="buy(${index})">
                Acheter
            </button>
        </div>
        `;
    });
}

function buy(index) {
    let qty = document.getElementById(`qty-${index}`).value;
    let product = products[index];

    // Récupération de la taille si le produit a des tailles
    let size = null;
    if (product.sizes) {
        size = document.getElementById(`size-${index}`).value;
    }

    // Vérification du stock
    if (qty > product.stock) {
        alert("Stock insuffisant !");
        return;
    }

    // Décrémentation du stock
    product.stock -= qty;

    // Confirmation de l'achat avec taille si applicable
    alert(`Achat : ${qty} x ${product.name} ${size ? "- Taille: " + size : ""}`);

    // Re-render de la boutique pour mettre à jour le stock
    renderShop();
}
