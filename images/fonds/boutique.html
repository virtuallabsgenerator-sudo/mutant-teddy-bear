<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Boutique</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('../common/boutique/teddy-dragon.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: rgba(0,0,0,0.7);
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    width: 250px;
    text-align: center;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    background: #ff3c3c;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

button:disabled {
    background: grey;
}

.nav {
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🛒 Boutique</h1>

    <div class="nav">
        <button onclick="location.href='../teddy-presentation.html'">Présentation</button>
        <button onclick="location.href='../../menu.html'">Menu</button>
    </div>
</header>

<audio controls autoplay loop>
    <source src="../../presentation/musique/mutant-teddy-bear-interlude-8.mp3" type="audio/mpeg">
</audio>

<div class="container" id="shop"></div>

<script>

let products = [

{
    name: "Teddy Toy Dragon",
    price: 29.99,
    img: "../common/boutique/teddy-dragon.jpeg",
    stock: 5,
    desc: `Teddy Toy Dragon – Limited Collector Edition

Light blue color, 20 cm size.

Includes a numbered collector box.

Bonus: M.T.B crypto tokens.

✔ Soft fabric
✔ Limited edition`
},

{
    name: "Teddy Toy Reptil",
    price: 24.99,
    img: "../common/boutique/teddy-reptil.jpeg",
    stock: 10,
    desc: `Exclusive Teddy Reptil plush.

✔ Collector item
✔ High quality`
},

{
    name: "M.T.B Sportswear",
    price: 99.99,
    img: "../common/boutique/sport-swear.jpg",
    stock: 25,
    desc: `Black tracksuit – slim fit

✔ 100% cotton
✔ Streetwear style
✔ Mutant Teddy Bear logo`
}

];

function renderShop() {
    let shop = document.getElementById("shop");
    shop.innerHTML = "";

    products.forEach((p, index) => {

        let stockText = p.stock > 0 ? `Stock: ${p.stock}` : "❌ Rupture";

        let disabled = p.stock === 0 ? "disabled" : "";

        shop.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <h3>${p.name}</h3>
            <p>${p.desc}</p>
            <p>${p.price}€</p>
            <p>${stockText}</p>

            <input type="number" id="qty-${index}" min="1" max="${p.stock}" value="1">

            <button ${disabled} onclick="buy(${index})">
                Acheter
            </button>
        </div>
        `;
    });
}

function buy(index) {
    let qty = document.getElementById(`qty-${index}`).value;
    let product = products[index];

    if (qty > product.stock) {
        alert("Stock insuffisant !");
        return;
    }

    product.stock -= qty;

    alert(`Achat : ${qty} x ${product.name}`);

    renderShop();
}

renderShop();

</script>

</body>
</html>
