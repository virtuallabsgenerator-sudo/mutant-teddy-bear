<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Boutique</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('../images/common/boutique/teddy-dragon.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: rgba(0,0,0,0.7);
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    width: 250px;
    text-align: center;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

button {
    margin-top: 10px;
    padding: 10px;
    border: none;
    background: #ff3c3c;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

button:disabled {
    background: grey;
    cursor: not-allowed;
}

.nav {
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🛒 Boutique</h1>

    <div class="nav">
        <button onclick="location.href='../presentation/page-acceuil'">Présentation</button>
        <button onclick="location.href='../../menu.html'">Menu</button>
    </div>
</header>

<!-- 🎵 Musique (optionnelle) -->
<audio controls autoplay loop>
    <source src="../../presentation/musique/mutant-teddy-bear-interlude-8.mp3" type="audio/mpeg">
</audio>

<div class="container" id="shop"></div>

<script>

// 🛍️ PRODUITS
let products = [
    {let products = [
    {
        name: "Teddy Dragon",
        price: 29.99,
        img: "../images/common/boutique/teddy-dragon.jpeg",
        stock: 5,
        desc: `Teddy Dragon – Limited Collector Edition

Discover the exclusive Teddy Dragon, a unique plush from the Mutant Teddy Bear Adventure universe.

Light blue color, 20 cm size.

Includes a numbered collector box.

Bonus: M.T.B crypto tokens usable in the game ecosystem or tradable.

✔ Soft fabric & polyester
✔ Limited edition
✔ Collector packaging
✔ EU compliant`
    },
    {
        name: "Teddy Deluxe",
        price: 49.99,
        img: "../common/boutique/teddy2.png",
        stock: 10,
        desc: `Premium collector teddy.

High quality materials and exclusive design.

Perfect for collectors.`
    },
    {
        name: "Teddy Deluxe",
        price: 29.99,
        img: "../common/boutique/teddy2.png",
        stock: 300,
        desc: "Version premium collector"
    }
];

// 🧠 AFFICHAGE
function renderShop() {
    let shop = document.getElementById("shop");
    shop.innerHTML = "";

    products.forEach((p, index) => {

        let stockText = p.stock > 0 ? `Stock: ${p.stock}` : "❌ Rupture de stock";

        let disabled = p.stock === 0 ? "disabled" : "";

        shop.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <h3>${p.name}</h3>
            <p>${p.desc}</p>
            <p>💰 ${p.price}€</p>
            <p>${stockText}</p>

            <input type="number" id="qty-${index}" min="1" max="${p.stock}" value="1">

            <button ${disabled} onclick="buy(${index})">
                Acheter
            </button>
        </div>
        `;
    });
}

// 💳 ACHAT
function buy(index) {
    let qty = document.getElementById(`qty-${index}`).value;
    let product = products[index];

    if (qty > product.stock) {
        alert("Stock insuffisant !");
        return;
    }

    product.stock -= qty;

    alert(`Achat confirmé : ${qty} x ${product.name}`);

    renderShop();
}

// 🚀 INIT
renderShop();

</script>

</body>
</html>
