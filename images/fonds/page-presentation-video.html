<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vidéos - Mutant Teddy Bear</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/images/design/font-site/font-site-01.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.7;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            color: #ffd700;
            margin: 20px 0 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        .videos-list {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        .video-card {
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            transition: transform 0.3s ease, border-color 0.3s;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
        }

        .video-desc {
            margin-top: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .boutons-nav {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 40px 0 20px;
            flex-wrap: wrap;
        }

        .bouton {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 16px;
        }

        .bouton:hover {
            background: #ffd700;
            color: black;
            transform: scale(1.05);
        }

        #boutonMusique {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid #ffd700;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s;
        }

        #boutonMusique:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }

        @media (max-width: 700px) {
            .video-card {
                max-width: 100%;
                padding: 15px;
            }
            h1 {
                font-size: 36px;
            }
            .video-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Musique d'ambiance (optionnelle) -->
    <!-- <audio id="musiqueFond" src="/presentation/musique/If-I-gotta-break-my-chains.mp3" preload="auto" loop></audio> -->

    <div class="container">
        
        <h1>🎬 VIDÉOS OFFICIELLES</h1>

        <div class="boutons-nav">

            <a href="/menu.html" class="bouton">← Menu</a>
        </div>

        <div class="videos-list">
            <!-- Carte vidéo 1 -->
            <div class="video-card">
                <div class="video-wrapper">
                    <iframe 
                    src="https://www.youtube.com/embed/X1U705a6qME" 
                    title="Mutant Teddy Bear Adventure" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                <div class="video-title">Titre de la première vidéo</div>
                <div class="video-desc">Courte description (optionnel).</div>
            </div>

            <!-- Carte vidéo 2 -->
            <div class="video-Promotion">
                <div class="video-wrapper">
              <iframe 
            src="https://youtu.be/Lx7GKEJrm6g"

            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
            </iframe>
                </div>
                <div class="video-title">Titre de la deuxième vidéo</div>
                <div class="video-desc">Courte description.</div>
            </div>

            <!-- Ajoute d'autres cartes ici en copiant le bloc -->
        </div>
    </div>
