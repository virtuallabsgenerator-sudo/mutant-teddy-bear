<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooping - Grille</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: black;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/images/design/font-site/marchandising.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.7;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            color: #ffd700;
            margin: 20px 0 30px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .grille-cartes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .carte {
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .carte:hover {
            transform: translateY(-10px);
            border-color: #ffd700;
        }

        .carte img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 10px;
            pointer-events: none;
        }

        .carte h3 {
            color: #ffd700;
            font-size: 16px;
            margin-top: 10px;
        }

        .boutons-nav {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0 40px;
        }

        .bouton {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .bouton:hover {
            background: #ffd700;
            color: black;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-contenu {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .modal-contenu img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .modal-fermer {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 50px;
            cursor: pointer;
        }

        .modal-fermer:hover {
            background: #ffd700;
            color: black;
        }

        #boutonMusique {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #ffd700;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
        }

        @media (max-width: 900px) {
            .grille-cartes { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .grille-cartes { grid-template-columns: 1fr; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <audio id="musiqueFond" src="/presentation/musique/mutant-teddy-bear-interlude-_8_.mp3" preload="auto" loop></audio>

    <div class="container">
        <h1>SHOOPING</h1>
        <div class="boutons-nav">
            <a href="/index.html" class="bouton">← Accueil</a>
            <a href="/menu.html" class="bouton">← Menu</a>
        </div>
        <div class="grille-cartes" id="grilleCartes"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-contenu">
            <img id="modalImage" src="" alt="">
            <button class="modal-fermer" onclick="fermerModal()">Fermer</button>
        </div>
    </div>

    <button id="boutonMusique">🔇 Activer la musique</button>

    <script>
        // ========== LISTE COMPLÈTE DES CARTES ==========
const cartes = [
    { nom: "PLUSH TOY COLLECTION", src: "/images/common/shooping/_03bc0475-80df-4f11-820f-c2480181c240.jpeg" },
    { nom: "PLUSH TOY COLLECTION", src: "/images/common/shooping/_0f1d042b-5bb5-4c9a-b477-f594e816a875.jpg" },
    { nom: "PLUSH TOY COLLECTION", src: "/images/common/shooping/_1d17853e-b231-4095-a172-2a5b01404f1e.jpg" },
    { nom: "PLUSH TOY COLLECTION", src: "/images/common/shooping/_5b80f9fb-8cf2-4ff3-adc5-d6f58c227951.jpeg" },
    { nom: "PLUSH TOY COLLECTION", src: "/images/common/shooping/_37017522-f4e8-4580-9d54-e9db18de348e.jpeg" },
    { nom: "PLUSH TOY COLLECTION", src: "/images/common/shooping/_4f28a430-c4f6-4e90-9c7a-34ad8972a92d.jpeg" },
    { nom: "PLUSH TOY COLLECTION", src: "/images/common/shooping/_5257d29d-7d1e-40cc-99e8-990073a38c2e.jpg" },
    { nom: "POLO COLLECTION", src: "/images/common/shooping/_dc031c2f-34c7-424b-80a0-077bb178e5de.jpg" },
    { nom: "POLO COLLECTION", src: "/images/common/shooping/_8f3a3096-a21d-4c3f-9407-6a1d038415ca.jpg" },
    { nom: "SPORTWEAR COLLECTION", src: "/images/common/shooping/_14ab0ef1-3912-4a92-a661-4f60d6223cba.jpg" },
    { nom: "BALL COLLECTION", src: "/images/common/shooping/_91b1f995-61a8-4dd2-8eb8-8902b4598915.jpg" },
    { nom: "BALL COLLECTION", src: "/images/common/shooping/_53a8d66a-5925-4035-83d4-ad2c4ededee5.jpg" },
    { nom: "MUG COLLECTION", src: "/images/common/shooping/_79aa7db0-090f-4442-abbb-66808a1eff91.jpg" },
    { nom: "DRINK COLLECTION", src: "/images/common/shooping/_70431809-705b-4814-82a8-78a75690fdb1.jpg" }
];

// ========== GÉNÉRATION DE LA GRILLE ==========
const grille = document.getElementById('grilleCartes');

cartes.forEach((carte, index) => {
    const div = document.createElement('div');
    div.className = 'carte';
    div.onclick = () => ouvrirModal(index);
    div.innerHTML = `
        <img src="${carte.src}" alt="${carte.nom}" onerror="this.onerror=null; this.src='/images/placeholder.webp'; console.error('Image introuvable : ${carte.src}')">
        <h3>${carte.nom}</h3>
    `;
    grille.appendChild(div);
});
        ];

        // ========== GÉNÉRATION DE LA GRILLE ==========
        const grille = document.getElementById('grilleCartes');
        
        cartes.forEach((carte, index) => {
            const div = document.createElement('div');
            div.className = 'carte';
            div.onclick = function() { ouvrirModal(index); };
            div.innerHTML = `
                <img src="${carte.src}" alt="${carte.nom}" onerror="this.src='/images/placeholder.webp'">
                <h3>${carte.nom}</h3>
            `;
            grille.appendChild(div);
        });

        // ========== DONNÉES MODAL ==========
        const imagesModal = cartes.map(c => ({ src: c.src }));

        // ========== FONCTIONS MODAL ==========
        function ouvrirModal(index) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = imagesModal[index].src;
            modal.classList.add('active');
            console.log("Modal ouvert, image:", imagesModal[index].src);
        }

        function fermerModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ========== MUSIQUE ==========
        const musiqueFond = document.getElementById('musiqueFond');
        const boutonMusique = document.getElementById('boutonMusique');
        
        if (localStorage.getItem('musiqueJoue') === 'true') {
            musiqueFond.play().catch(e => console.log("Auto-play bloqué"));
            boutonMusique.textContent = '🔊 Couper la musique';
        }
        
        boutonMusique.addEventListener('click', () => {
            if (musiqueFond.paused) {
                musiqueFond.play();
                boutonMusique.textContent = '🔊 Couper la musique';
                localStorage.setItem('musiqueJoue', 'true');
            } else {
                musiqueFond.pause();
                boutonMusique.textContent = '🔇 Activer la musique';
                localStorage.setItem('musiqueJoue', 'false');
            }
        });

        // ========== FERMETURE MODAL ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fermerModal();
        });

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('modal');
            if (e.target === modal) fermerModal();
        });
    </script>

</body>
</html>
