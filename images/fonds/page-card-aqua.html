<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Aqua - Grille</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/images/design/font-site/font-site-01.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.7;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            color: white;
        }

        .image-presentation {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 40px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .image-presentation img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-presentation:hover img {
            transform: scale(1.02);
        }

        h1 {
            text-align: center;
            font-size: 48px;
            color: #ffd700;
            margin: 30px 0 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        .section-cartes {
            margin: 60px 0;
        }

        .grille-cartes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .carte {
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .carte:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #ffd700;
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.3);
        }

        .carte img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .carte:hover img {
            transform: scale(1.05);
        }

        .carte h3 {
            color: #ffd700;
            font-size: 18px;
            text-align: center;
            margin: 12px 0 5px;
        }

        .boutons-nav {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .bouton {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .bouton:hover {
            background: #ffd700;
            color: black;
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal-contenu {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            max-width: 600px;
            width: 90%;
            animation: modalApparition 0.3s ease;
        }

        @keyframes modalApparition {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-contenu img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .modal-fermer {
            display: block;
            margin: 20px auto 0;
            padding: 10px 40px;
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-fermer:hover {
            background: #ffd700;
            color: black;
        }

        #boutonMusique {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid #ffd700;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s;
        }

        #boutonMusique:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .grille-cartes {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .grille-cartes {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <audio id="musiqueFond" src="/presentation/musique/bande-son-game-play-mtb-1.mp3" preload="auto" loop></audio>

    <div class="container">
        
        <div class="image-presentation">
            <img src="/images/banderole/banniere-mtb%20(1).webp" alt="Présentation Collection">
        </div>

        <h1>TEDDY BEAR AQUA COLLECTION</h1>

        <div class="boutons-nav">
            <a href="/index.html" class="bouton">← Accueil</a>
            <a href="/menu.html" class="bouton">← Menu principal</a>
        </div>

        <div class="section-cartes">
            <div class="grille-cartes">
                
                <!-- Carte 0 -->
                <div class="carte" onclick="ouvrirModal(0)">
                    <img src="/images/common/aqua/common-siren.webp" alt="Siren Teddy">
                    <h3>SIREN TEDDY</h3>
                </div>

                <!-- Carte 1 -->
                <div class="carte" onclick="ouvrirModal(1)">
                    <img src="/images/common/aqua/common-yeti.webp" alt="Yeti Teddy">
                    <h3>YETI TEDDY</h3>
                </div>

                <!-- Carte 2 -->
                <div class="carte" onclick="ouvrirModal(2)">
                    <img src="/images/common/aqua/common-frezzer-teddy.webp" alt="Frezzer Teddy">
                    <h3>FREZZER TEDDY</h3>
                </div>

                <!-- Carte 3 -->
                <div class="carte" onclick="ouvrirModal(3)">
                    <img src="/images/common/destroy-factory/4-watter-master-common.png" alt="Water Master">
                    <h3>WATTER MASTER</h3>
                </div>

                <!-- Carte 4 -->
                <div class="carte" onclick="ouvrirModal(4)">
                    <img src="/images/common/destroy-factory/5-psycho-common.png" alt="Psycho Teddy">
                    <h3>PSYCHO TEDDY</h3>
                </div>

                <!-- Carte 5 -->
                <div class="carte" onclick="ouvrirModal(5)">
                    <img src="/images/common/destroy-factory/6-doctor-common.png" alt="Doctor Teddy">
                    <h3>DOCTOR TEDDY</h3>
                </div>

                <!-- Carte 6 -->
                <div class="carte" onclick="ouvrirModal(6)">
                    <img src="/images/common/destroy-factory/7-iceberg-common.png" alt="Iceberg Teddy">
                    <h3>ICEBERG TEDDY</h3>
                </div>

                <!-- Carte 7 -->
                <div class="carte" onclick="ouvrirModal(7)">
                    <img src="/images/common/destroy-factory/132-cleaner-common.png" alt="Cleaner Teddy">
                    <h3>CLEANER TEDDY</h3>
                </div>

                <!-- Carte 8 -->
                <div class="carte" onclick="ouvrirModal(8)">
                    <img src="/images/common/destroy-factory/15-pirate-common.png" alt="Pirate Teddy">
                    <h3>PIRATE TEDDY</h3>
                </div>

                <!-- Carte 9 -->
                <div class="carte" onclick="ouvrirModal(9)">
                    <img src="/images/common/destroy-factory/128-space-common.png" alt="Space Teddy">
                    <h3>SPACE TEDDY</h3>
                </div>

                <!-- Carte 10 -->
                <div class="carte" onclick="ouvrirModal(10)">
                    <img src="/images/common/destroy-factory/intellingencer-common.png" alt="Intelligencer Teddy">
                    <h3>INTELLINGENCER TEDDY</h3>
                </div>

                <!-- Carte 11 -->
                <div class="carte" onclick="ouvrirModal(11)">
                    <img src="/images/common/destroy-factory/23-mma-common.png" alt="MMA Teddy">
                    <h3>MMA TEDDY</h3>
                </div>

            </div>
        </div>

    </div>

    <div class="modal" id="modal">
        <div class="modal-contenu">
            <img id="modalImage" src="" alt="Image agrandie">
            <button class="modal-fermer" onclick="fermerModal()">Fermer</button>
        </div>
    </div>

    <button id="boutonMusique">🔇 Activer la musique</button>

    <script>
        // ========== DONNÉES DES IMAGES POUR LE MODAL ==========
        const imagesData = [
            { src: "/images/common/aqua/common-siren.webp" },
            { src: "/images/common/aqua/common-yeti.webp" },
            { src: "/images/common/aqua/common-frezzer-teddy.webp" },
            { src: "/images/common/destroy-factory/4-watter-master-common.png" },
            { src: "/images/common/destroy-factory/5-psycho-common.png" },
            { src: "/images/common/destroy-factory/6-doctor-common.png" },
            { src: "/images/common/destroy-factory/7-iceberg-common.png" },
            { src: "/images/common/destroy-factory/132-cleaner-common.png" },
            { src: "/images/common/destroy-factory/15-pirate-common.png" },
            { src: "/images/common/destroy-factory/128-space-common.png" },
            { src: "/images/common/destroy-factory/intellingencer-common.png" },
            { src: "/images/common/destroy-factory/23-mma-common.png" }
        ];

        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        
        const musiqueFond = document.getElementById('musiqueFond');
        const boutonMusique = document.getElementById('boutonMusique');
        
        if (localStorage.getItem('musiqueJoue') === 'true') {
            musiqueFond.play().catch(e => console.log("Lecture auto bloquée"));
            boutonMusique.textContent = '🔊 Couper la musique';
        } else {
            boutonMusique.textContent = '🔇 Activer la musique';
        }
        
        boutonMusique.addEventListener('click', function() {
            if (musiqueFond.paused) {
                musiqueFond.play();
                boutonMusique.textContent = '🔊 Couper la musique';
                localStorage.setItem('musiqueJoue', 'true');
            } else {
                musiqueFond.pause();
                boutonMusique.textContent = '🔇 Activer la musique';
                localStorage.setItem('musiqueJoue', 'false');
            }
        });

        function ouvrirModal(index) {
            modalImage.src = imagesData[index].src;
            modal.classList.add('active');
        }

        function fermerModal() {
            modal.classList.remove('active');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                fermerModal();
            }
        });

        window.addEventListener('click', function(e) {
            if (e.target === modal) {
                fermerModal();
            }
        });
    </script>

</body>
</html>
