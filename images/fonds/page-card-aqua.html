
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Haute Résolution - Teddy</title>
    <style>
        /* ========== RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
            min-height: 100vh;
            position: relative;
        }

        /* Image de fond */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('/images/design/font-site/Nouveau projet (2).jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.7;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            color: white;
        }

        /* ========== IMAGE DE PRÉSENTATION 1920x1080 ========== */
        .image-presentation {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 40px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .image-presentation img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-presentation:hover img {
            transform: scale(1.02);
        }

        /* ========== TITRE ========== */
        h1 {
            text-align: center;
            font-size: 48px;
            color: #ffd700;
            margin: 30px 0 50px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        /* ========== FENÊTRE CENTRALE POUR LES GRANDES IMAGES ========== */
        .visionneuse {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            min-height: 600px;
        }

        #imagePrincipale {
            max-width: 100%;
            max-height: 800px;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }

        /* ========== BOUTONS DE NAVIGATION ========== */
        .navigation {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0 20px;
        }

        .nav-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.2);
            border: 3px solid #ffd700;
            color: #ffd700;
            font-size: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .nav-btn:hover {
            background: #ffd700;
            color: black;
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        /* Indicateur de position */
        .compteur {
            text-align: center;
            color: #ffd700;
            font-size: 18px;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* ========== ZONE DE TEXTE ASSOCIÉ ========== */
        .texte-associe {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 40px;
            margin: 40px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: texteApparition 0.5s ease;
        }

        @keyframes texteApparition {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .texte-associe h2 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 20px;
            border-left: 5px solid #ffd700;
            padding-left: 20px;
        }

        .texte-associe p {
            font-size: 18px;
            line-height: 1.8;
            color: white;
            text-align: justify;
        }

        /* ========== BOUTONS DE NAVIGATION ========== */
        .boutons-nav {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .bouton {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .bouton:hover {
            background: #ffd700;
            color: black;
            transform: scale(1.05);
        }

        /* ========== ANIMATION DE CHARGEMENT ========== */
        .loading {
            text-align: center;
            padding: 50px;
            color: #ffd700;
            font-size: 24px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }

            .image-container {
                min-height: 300px;
            }

            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .texte-associe {
                padding: 20px;
            }

            .texte-associe h2 {
                font-size: 24px;
            }

            .texte-associe p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- IMAGE DE PRÉSENTATION 1920x1080 -->
        <div class="image-presentation">
            <img src="/images/banderole/banniere-mtb (1).webp" alt="Présentation Galerie">
        </div>

        <!-- TITRE PRINCIPAL -->
        <h1>MUTANT TEDY BEAR AQUA</h1>

        <!-- BOUTONS NAVIGATION -->
        <div class="boutons-nav">
            <a href="/index.html" class="bouton">← Accueil</a>
            <a href="/menu.html" class="bouton">← Menu principal</a>
        </div>

        <!-- VISIONNEUSE D'IMAGES -->
        <div class="visionneuse">
            
            <!-- Conteneur de l'image -->
            <div class="image-container">
                <img id="imagePrincipale" src="/images/design/banniere/_9b0fcb32-15f3-4932-9374-484aaa2def69.jpg" alt="Image haute résolution">
            </div>

            <!-- Boutons de navigation -->
            <div class="navigation">
                <button class="nav-btn" onclick="imagePrecedente()">←</button>
                <button class="nav-btn" onclick="imageSuivante()">→</button>
            </div>

            <!-- Compteur -->
            <div class="compteur" id="compteur">1 / 10</div>

        </div>

        <!-- ZONE DE TEXTE ASSOCIÉ -->
        <div class="texte-associe" id="texteAssocie">
            <h2 id="titreImage">Titre de l'image</h2>
            <p id="descriptionImage">Description détaillée de l'image...</p>
        </div>

    </div>

    <script>
        // ========== DONNÉES DES IMAGES ==========
        const imagesData = [
            {
                src: "/images/common/aqua/common-siren.webp",
                titre: "SIREN TEDDY BEAR",
                description: "  Transformed during the shadow sorcerer's curse, Siren Teddy Bear uses her enchanted mermaid tail to launch razor-sharp shells at her enemies. Each projectile shimmers with sea magic, striking with the precision of ocean currents.

"
            },
            {
                src: "/images/common/aqua/common-yeti.webp",
                titre: " YETI TEDDY BEAR",
                description: " Transformed into a mighty yeti during the shadow sorcerer's curse, Yeti Teddy Bear wields a massive club of solid ice that can shatter any dark armor. His thick fur protects him from enemy attacks, making him a living fortress on the battlefield. "
            },
            {
                src: "/images/common/aqua/common-frezzer-teddy.webp",
                titre: " FREZZER TEDDY BEAR",
                description: "Transformed during the shadow sorcerer's curse, Frezzer Teddy Bear creates powerful ice spheres that he hurls at his enemies. Each frozen projectile explodes on impact, freezing dark forces in their tracks."
            },
            {
                src: "/images/secret/common/4-WATER MASTER TEDDY COMMON.png",
                titre: " WATTER MASTER TEDDY BEAR",
                description: " Transformed during the shadow sorcerer's curse, Watter Master Teddy Bear commands water with precision. He sends powerful water spheres crashing into enemies and can summon a shimmering water shield to block incoming attacks, protecting both himself and his allies.

   "
            },
            {
                src: "/images/secret/common/5-PSYCHO TEDDY COMMON.png",
                titre: " PSYCHO TEDDY BEAR",
                description: "  Transformed during the shadow sorcerer's curse, Psycho Teddy Bear commands water to create miniature teddy bears made entirely of liquid. These aquatic warriors rush into battle, attacking enemies with relentless waves before dissolving back into water.  "
            },
            {
                src: "/images/secret/common/11-PSYCHO TEDDY PARRALEL COMMON.png",
                titre: "PSYCHO TEDDY BEAR",
                description: " Transformed during the shadow sorcerer's curse, Psycho Teddy Bear shapes water into powerful weapons and hurls devastating water projectiles at his enemies. From swords and spears to razor-sharp discs, his liquid arsenal adapts to any battlefield.

  "
            },
            {
                src: "/images/secret/common/6-DOCTOR TEDDY COMMON.png",
                titre: " DOCTOR TEDDY BEAR",
                description: "  Once a simple teddy bear from the peaceful village of Fluffington, Dr. Cuddlesworth was transformed during the great shadow sorcerer’s curse. Unlike others who gained destructive powers, he awakened a rare and precious gift: the ability to heal.

Now serving as the medic of the Mutant Teddy Bear resistance, he roams the battlefield with his worn-out doctor’s coat and a bag full of glowing potions made from starlight and enchanted herbs. His touch can close wounds, restore energy, and even calm the corrupted minds of lesser Dark Teddies. "
            },
            {
                src: "/images/secret/common/7-ICBERG TEDDY COMMON.png",
                titre: "ICEBERG TEDDY BEAR",
                description: "Transformed during the shadow sorcerer's curse, Icerberg Teddy Bear commands the frozen earth beneath his paws. He summons sharp ice spikes that erupt from the ground to impale enemies or rise as solid barriers to block incoming attacks."
            },
            {
                src: "/images/secret/common/115-HALLOWEEN TEDDY COMMON.png",
                titre: "HALLOWEEN TEDDY BEAR",
                description: "ransformed during the shadow sorcerer's curse, Halloween Teddy Bear scatters magical candies across the battlefield. Any enemy that steps on them becomes frozen in place for several precious moments, leaving them vulnerable to counterattacks."
            },
            {
                src: "/images/secret/common/15-PIRATE TEDDY COMMON.png",
                titre: "PIRATE TEDDY BEAR",
                description: "Transformed during the shadow sorcerer's curse, Pirate Teddy Bear uses his wooden peg leg as a powerful water cannon, launching explosive water cannonballs at his enemies. When enemies get close, he strikes with his enchanted cutlass, each swing unleashing sharp jets of water that cut through dark forces."
            }
        ];

        // ========== VARIABLES ==========
        let indexActuel = 0;
        const imagePrincipale = document.getElementById('imagePrincipale');
        const titreImage = document.getElementById('titreImage');
        const descriptionImage = document.getElementById('descriptionImage');
        const compteur = document.getElementById('compteur');

        // ========== FONCTIONS DE NAVIGATION ==========
        function chargerImage(index) {
            // S'assurer que l'index reste dans les limites
            indexActuel = (index + imagesData.length) % imagesData.length;
            
            // Ajouter un effet de transition
            imagePrincipale.style.opacity = '0.5';
            
            // Charger la nouvelle image
            setTimeout(() => {
                imagePrincipale.src = imagesData[indexActuel].src;
                titreImage.textContent = imagesData[indexActuel].titre;
                descriptionImage.textContent = imagesData[indexActuel].description;
                compteur.textContent = `${indexActuel + 1} / ${imagesData.length}`;
                
                // Réafficher l'image
                imagePrincipale.style.opacity = '1';
            }, 200);
        }

        function imageSuivante() {
            chargerImage(indexActuel + 1);
        }

        function imagePrecedente() {
            chargerImage(indexActuel - 1);
        }

        // ========== GESTION DES TOUCHES CLAVIER ==========
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                imagePrecedente();
            } else if (e.key === 'ArrowRight') {
                imageSuivante();
            }
        });

        // ========== PRÉCHARGEMENT DES IMAGES (optionnel) ==========
        function prechargerImages() {
            imagesData.forEach(img => {
                const preload = new Image();
                preload.src = img.src;
            });
        }

        // Lancer le préchargement après le chargement de la page
        window.addEventListener('load', prechargerImages);

        // ========== GESTION DU REDIMENSIONNEMENT ==========
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                // Re-centrer l'image si nécessaire
                console.log('Fenêtre redimensionnée');
            }, 250);
        });
    </script>



   <!-- ========== MUSIQUE DE FOND ========== -->
    <audio id="musiqueFond" src="/presentation/musique/It’s-a-love-1.mp3" preload="auto" loop></audio>
    
    <!-- Bouton pour couper/activer la musique -->
    <button id="boutonMusique" style="position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); color: white; border: 1px solid #ffd700; border-radius: 50px; cursor: pointer; z-index: 1000; transition: all 0.3s;">
        🔇 Activer la musique
    </button>

    <script>
        // ========== GESTION DE LA MUSIQUE DE FOND ==========
        const musiqueFond = document.getElementById('musiqueFond');
        const boutonMusique = document.getElementById('boutonMusique');
        
        // Vérifier si la musique était déjà jouée depuis l'accueil
        if (localStorage.getItem('musiqueJoue') === 'true') {
            musiqueFond.play().catch(e => console.log("Lecture auto bloquée"));
            boutonMusique.textContent = '🔊 Couper la musique';
        } else {
            boutonMusique.textContent = '🔇 Activer la musique';
        }
        
        // Bouton pour couper/activer la musique
        boutonMusique.addEventListener('click', function() {
            if (musiqueFond.paused) {
                musiqueFond.play();
                boutonMusique.textContent = '🔊 Couper la musique';
                localStorage.setItem('musiqueJoue', 'true');
            } else {
                musiqueFond.pause();
                boutonMusique.textContent = '🔇 Activer la musique';
                localStorage.setItem('musiqueJoue', 'false');
            }
        });
    </script>
    


    
</body>
</html>
