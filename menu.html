<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background-image: url('/images/design/font-site/font-site-01.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 48px;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .carrousel-section {
            margin-bottom: 60px;
        }

        .carrousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .carrousel-section h2 {
            color: white;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
        }

        .controles-carrousel {
            display: flex;
            gap: 15px;
        }

        .btn-carrousel {
            padding: 8px 20px;
            background: rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid #ffd700;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-carrousel:hover {
            background: #ffd700;
            color: black;
            transform: scale(1.05);
        }

        .carrousel-container {
            overflow: hidden;
            padding: 20px 0;
        }

        .carrousel {
            display: flex;
            gap: 30px;
            width: fit-content;
        }

        /* Animation vers la gauche */
        .carrousel.left {
            animation: scrollLeft 25s linear infinite;
        }

        /* Animation vers la droite */
        .carrousel.right {
            animation: scrollRight 25s linear infinite;
        }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes scrollRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .fenetre {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: block;
            min-width: 250px;
        }

        .fenetre:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .fenetre img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .fenetre:hover img {
            transform: scale(1.1);
        }

        .fenetre h3 {
            text-align: center;
            font-size: 18px;
            margin-top: 10px;
        }

        .bouton-retour {
            display: inline-block;
            margin: 30px 0;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
        }

        .bouton-retour:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        #boutonMusique {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid #ffd700;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s;
        }

        #boutonMusique:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .carrousel-header { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 32px; }
            .fenetre { min-width: 200px; }
            .fenetre img { height: 150px; }
        }
    </style>
</head>

    <button id="boutonMusique">🔇 Activer la musique</button>
    
    <script>
        // ========== MUSIQUE ==========
        const audio = document.getElementById('musiqueAccueil');
        const boutonMusique = document.getElementById('boutonMusique');
        
        if (localStorage.getItem('musiqueJoue') === 'true') {
            audio.play().catch(e => console.log("Auto-play bloqué"));
            boutonMusique.textContent = '🔊 Couper la musique';
        }
        
        boutonMusique.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                boutonMusique.textContent = '🔊 Couper la musique';
                localStorage.setItem('musiqueJoue', 'true');
            } else {
                audio.pause();
                boutonMusique.textContent = '🔇 Activer la musique';
                localStorage.setItem('musiqueJoue', 'false');
            }
        });
        
        // ========== GESTION DES CARROUSELS ==========
        
        // Carrousel 1
        const carrousel1 = document.getElementById('carrousel1');
        const left1 = document.getElementById('left1');
        const right1 = document.getElementById('right1');
        
        left1.addEventListener('click', () => {
            carrousel1.classList.remove('left', 'right');
            carrousel1.classList.add('left');
        });
        
        right1.addEventListener('click', () => {
            carrousel1.classList.remove('left', 'right');
            carrousel1.classList.add('right');
        });
        
        // Carrousel 2
        const carrousel2 = document.getElementById('carrousel2');
        const left2 = document.getElementById('left2');
        const right2 = document.getElementById('right2');
        
        left2.addEventListener('click', () => {
            carrousel2.classList.remove('left', 'right');
            carrousel2.classList.add('left');
        });
        
        right2.addEventListener('click', () => {
            carrousel2.classList.remove('left', 'right');
            carrousel2.classList.add('right');
        });
    </script>
